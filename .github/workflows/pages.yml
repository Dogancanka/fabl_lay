name: Deploy to GitHub Pages

# The site is served from the gh-pages branch (Settings → Pages). This
# workflow keeps that branch in sync with main, so every merge re-deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
